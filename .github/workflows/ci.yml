name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexitype
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          # Enables the Postgres-backed integration tests (they skip when unset).
          FLEXITYPE_TEST_DSN: postgres://postgres:postgres@localhost:5432/flexitype?sslmode=disable
        # The timeout is a HANG detector, not a performance budget: it has to
        # exceed the slowest package on the slowest runner, and the root suite
        # runs the whole API and every Postgres integration case under -race
        # while the other packages share one database.
        run: go test -race -timeout 300s ./...
      - name: Client module (build, vet, test)
        run: |
          cd client && go build ./... && go vet ./... && go test -race ./...
      - name: Server module (build, vet, test)
        run: |
          cd cmd/flexitype && go build ./... && go vet ./... && go test -race ./...
      - name: Pub/Sub adapter module (build, vet, test)
        run: |
          cd infrastructure/gcppubsub && go build ./... && go vet ./... && go test -race ./...
      - name: Client conformance (client SDK vs the real handler)
        run: |
          cd conformance && go test -race ./...
      # The marketplace example is two modules of adopter-shaped code against
      # the client SDK. Its suites drive a real flexitype, so they catch an API
      # change that compiles but no longer behaves the way an adopter's service
      # depends on.
      - name: Marketplace example — platform module
        env:
          FLEXITYPE_TEST_DSN: postgres://postgres:postgres@localhost:5432/flexitype?sslmode=disable
        run: |
          cd examples/marketplace/platform && go build ./... && go vet ./... && go test -race ./...
      - name: Marketplace example — storefront module
        env:
          FLEXITYPE_TEST_DSN: postgres://postgres:postgres@localhost:5432/flexitype?sslmode=disable
        run: |
          cd examples/marketplace/storefront && go build ./... && go vet ./... && go test -race ./...
      # docs/configuration.md states that transaction-mode pooling is
      # supported. That is a contract, so it is tested rather than asserted:
      # the Postgres suites run again through PgBouncer in transaction mode.
      # binary_parameters=yes because lib/pq uses the extended query protocol,
      # which a pooled connection cannot serve with named prepared statements.
      - name: Postgres through PgBouncer (transaction pooling)
        env:
          FLEXITYPE_TEST_DSN: postgres://postgres:postgres@localhost:6432/flexitype?sslmode=disable&binary_parameters=yes
        run: |
          set -euo pipefail
          docker run -d --name pgbouncer --network host \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_USER=postgres \
            -e DB_PASSWORD=postgres -e DB_NAME=flexitype \
            -e POOL_MODE=transaction -e AUTH_TYPE=scram-sha-256 \
            -e LISTEN_PORT=6432 -e MAX_PREPARED_STATEMENTS=100 \
            -e DEFAULT_POOL_SIZE=2 -e MAX_CLIENT_CONN=100 \
            edoburu/pgbouncer:v1.24.1-p1
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 6432 -U postgres > /dev/null 2>&1; then break; fi
            sleep 1
          done
          # Serially, sharing the default schema: the per-package schema
          # isolation is carried as a startup parameter, which a
          # transaction-mode pooler does not proxy. That is a limit of the
          # test harness, not of the product's SQL — which is exactly what
          # this job exists to prove.
          FLEXITYPE_TEST_SHARED_SCHEMA=1 go test -count=1 -p 1 ./infrastructure/postgres/... .
          # The concurrent-migration case again on a CONTENDED pool
          # (DEFAULT_POOL_SIZE=2, six runners). The serial run above cannot
          # catch the hazard it targets: with an idle pool PgBouncer hands
          # consecutive statements to the same backend, so a session-scoped
          # lock appears to work. A rolling deploy is neither serial nor idle.
          FLEXITYPE_TEST_SHARED_SCHEMA=1 go test -count=1 -run TestConcurrentMigrateIntegration ./infrastructure/postgres/
          docker rm -f pgbouncer
      - name: Smoke test (migrations + service boot)
        env:
          FLEXITYPE_PORT: "58080"
          FLEXITYPE_DB_HOST: localhost
          FLEXITYPE_DB_PORT: "5432"
          # Authentication is required by default; this smoke test drives the
          # API with no credentials, so it opts out by name like any other
          # development stack.
          FLEXITYPE_DEV_INSECURE: "true"
        run: |
          set -euo pipefail
          (cd cmd/flexitype && go build -o /tmp/flexitype .)
          # The step assumes the port is free, and a run has failed with
          # "bind: address already in use" while nothing else in this workflow
          # binds it. Wait briefly, then say WHAT holds it: a bare bind error
          # gives an operator nothing to act on.
          for _ in $(seq 1 10); do
            if ! ss -ltn "sport = :58080" | grep -q LISTEN; then break; fi
            sleep 1
          done
          if ss -ltn "sport = :58080" | grep -q LISTEN; then
            echo "port 58080 is still held before the smoke test:"
            ss -ltnp "sport = :58080" || true
            exit 1
          fi
          /tmp/flexitype &
          SERVICE_PID=$!
          for i in $(seq 1 30); do
            if curl -fs localhost:58080/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fs localhost:58080/readyz
          curl -fs -X POST localhost:58080/api/v1/type-definitions \
            -d '{"internal_name":"smoke","display_name":"Smoke"}' | grep -q '"internal_name":"smoke"'
          kill $SERVICE_PID

  compose:
    name: compose quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The quickstart is the project's first-touch experience, and it broke
      # once already: a loopback-only SSL guard refused the compose file's
      # container hostname, so `docker compose up` crash-looped on config
      # validation and no test noticed, because CI only ever booted against
      # localhost.
      - name: Boot the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: The service is ready and serves the API
        run: |
          curl -fs localhost:8080/readyz
          curl -fs -X POST localhost:8080/api/v1/type-definitions \
            -d '{"internal_name":"smoke","display_name":"Smoke"}' | grep -q '"internal_name":"smoke"'
      - name: An unknown API path is a JSON 404, not the console
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' localhost:8080/api/v1/does-not-exist)
          test "$code" = "404"
          grep -q '"code"' /tmp/body
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  marketplace:
    name: marketplace example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every command in the example's README and seed.sh is meant to be real.
      # The only way to keep that true is to run them: the stack comes up, the
      # seed onboards three merchants and asserts what a shopper sees, and the
      # seed is then run a second time to prove onboarding is idempotent.
      - name: Boot the marketplace stack
        working-directory: examples/marketplace
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Seed and assert
        working-directory: examples/marketplace
        run: ./seed.sh
      - name: The seed is re-runnable
        working-directory: examples/marketplace
        run: ./seed.sh
      - name: Service logs on failure
        if: failure()
        working-directory: examples/marketplace
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: examples/marketplace
        run: docker compose down --volumes

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
      # The action lints ONE module — the one in the working directory — so a
      # nested module is only covered by naming it. Both example modules share
      # the repository's .golangci.yml, which golangci-lint finds by walking up.
      - name: golangci-lint (marketplace example)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: examples/marketplace/platform
      - name: golangci-lint (marketplace storefront)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          working-directory: examples/marketplace/storefront

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Test
        run: npm test

  client-ts:
    name: client-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # The suite includes two contract gates: the error codes must match the
      # OpenAPI enum, the Go client and docs/api-stability.md, and the checked-in
      # generated types must match a fresh run of the generator. A change to
      # api/openapi.yaml that nobody regenerated fails here.
      - name: Test
        run: npm test

  marketplace-ui:
    name: marketplace ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # The console consumes the TypeScript SDK as a file dependency, so the
      # SDK has to be built before the console installs against it. That is
      # also how the Dockerfile does it.
      - name: Build the TypeScript SDK
        working-directory: client-ts
        run: npm ci && npm run build
      - name: Merchant console (typecheck, test, build)
        working-directory: examples/marketplace/console
        run: |
          npm ci
          npx tsc -b --force
          npm test
          npm run build
      - name: Shopper storefront (typecheck, test, build)
        working-directory: examples/marketplace/shop
        run: |
          npm ci
          npx tsc -b --force
          npm test
          npm run build

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flexitype
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true
          cache: true
      - name: Coverage
        env:
          # The Postgres-backed suites skip without a DSN, which would drop the
          # infrastructure/postgres numbers (and the total) sharply.
          FLEXITYPE_TEST_DSN: postgres://postgres:postgres@localhost:5432/flexitype?sslmode=disable
          # Ratcheted upward as coverage lands; never lower it to make CI pass.
          MIN_COVERAGE: "90"
        run: ./scripts/coverage.sh
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: warn
