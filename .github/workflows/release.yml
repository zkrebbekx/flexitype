# Cuts a GitHub release on a version tag: builds version-stamped binaries
# for the standalone service across platforms and attaches them. The
# console is embedded (its committed dist stub keeps `go build` working;
# a full console build is produced first so releases ship the real UI).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          check-latest: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build console
        working-directory: web
        run: npm ci && npm run build

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/flexitype_${VERSION}_${os}_${arch}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -C cmd/flexitype -ldflags "-s -w -X main.version=${VERSION}" -o "../../$out" .
            (cd dist && sha256sum "$(basename "$out")" >> checksums.txt)
          done

      # Nested-module tags are cut BEFORE the release, so a failure blocks
      # the release rather than following it. The previous order published
      # vX.Y.Z first and swallowed every tag failure — permissions, rate
      # limit, network — as "already exists", leaving a green pipeline and a
      # client module that `go get .../client@vX.Y.Z` could not resolve.
      - name: Tag the nested modules
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for module in client cmd/flexitype infrastructure/gcppubsub; do
            tag="${module}/${VERSION}"
            # An existing tag on this exact commit is the only benign
            # failure — a re-run of the same release. Anything else fails.
            existing=$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)
            if [ -n "$existing" ]; then
              if [ "$existing" = "$SHA" ]; then
                echo "${tag} already points at ${SHA}"
                continue
              fi
              echo "::error::${tag} exists and points at ${existing}, not ${SHA}" >&2
              exit 1
            fi
            gh api "repos/${REPO}/git/refs" \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${SHA}"
            echo "tagged ${tag}"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          notes=$(awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes "${notes:-See CHANGELOG.md.}"

  # Publish the container image (console embedded) to GHCR on the same tag.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
