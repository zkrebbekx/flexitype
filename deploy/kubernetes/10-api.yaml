# The API tier: serves requests, runs no background loops.
#
# Migrations run on start on every replica; they serialise on an advisory
# lock, so a rollout of N pods applies them once. See docs/upgrades.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexitype-api
  labels: { app.kubernetes.io/name: flexitype, app.kubernetes.io/component: api }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: flexitype, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: flexitype, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Above FLEXITYPE_SHUTDOWN_TIMEOUT, so in-flight work drains before
      # SIGKILL rather than being cut off by it.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: flexitype
          image: ghcr.io/zkrebbekx/flexitype:latest # pin a digest in production
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: flexitype } }]
          env:
            # No background loops here: this tier scales on request rate, and
            # a rollout must not interrupt event delivery.
            - { name: FLEXITYPE_RUN_RELAY, value: "false" }
            - { name: FLEXITYPE_RUN_DELIVERY_WORKER, value: "false" }
            - { name: FLEXITYPE_RUN_PRUNER, value: "false" }
            - { name: FLEXITYPE_RUN_SCHEDULER, value: "false" }
            - name: FLEXITYPE_DB_URL
              valueFrom: { secretKeyRef: { name: flexitype-db, key: url } }
          volumeMounts:
            - { name: accounts, mountPath: /etc/flexitype, readOnly: true }
          # Liveness asks "is the process up"; readiness asks "can it serve",
          # which includes the database. Only readiness should gate traffic.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            # Generous: the first pod of a release may be applying migrations.
            failureThreshold: 40
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: accounts
          secret: { secretName: flexitype-accounts }
---
apiVersion: v1
kind: Service
metadata:
  name: flexitype
  labels: { app.kubernetes.io/name: flexitype }
spec:
  selector: { app.kubernetes.io/name: flexitype, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
