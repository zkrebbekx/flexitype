# A multi-tenant marketplace on flexitype: Postgres, a standalone flexitype
# with provisioning and the outbox on, a merchant platform and a shopper
# storefront.
#
#   cd examples/marketplace
#   docker compose up --build --wait
#   ./seed.sh                          # onboards merchants, seeds products
#
# Both services talk to flexitype over HTTP with the Go SDK. Neither embeds the
# library.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flexitype
      POSTGRES_PASSWORD: flexitype
      POSTGRES_DB: flexitype
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexitype"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A named volume is created owned by root, and the flexitype image runs as
  # the distroless `nonroot` user (65532). Without this one-shot chown, the
  # first product-image upload fails with "permission denied" from inside the
  # blob store — long after the stack has come up healthy.
  blob-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /blobs && chown -R 65532:65532 /blobs"]
    volumes:
      - blobs:/blobs

  flexitype:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      blob-init:
        condition: service_completed_successfully
    environment:
      FLEXITYPE_DB_HOST: postgres
      FLEXITYPE_DB_PORT: "5432"
      FLEXITYPE_DB_USER: flexitype
      FLEXITYPE_DB_PASSWORD: flexitype
      FLEXITYPE_DB_NAME: flexitype
      FLEXITYPE_MIGRATE_ON_START: "true"
      # This opts out of ONE production guard: an unencrypted connection to a
      # non-loopback database host, which is what a compose network is. It says
      # so and nothing else — authentication stays on, and every request in
      # this stack presents a service-account token.
      FLEXITYPE_DB_ALLOW_PLAINTEXT: "true"
      # Provisioning creates tenants and service accounts at runtime, which is
      # what onboarding a merchant means here. It also makes authentication
      # database-backed, so no service-account file is involved.
      FLEXITYPE_PROVISIONING: "true"
      # Seed the first admin account. This stack DECIDES its token rather than
      # letting the service mint one: a minted token is printed once, and this
      # image is distroless, so no other container could ever capture it. The
      # same value is given to the platform below.
      #
      # A real deployment generates one with `flexitype bootstrap-token` and
      # keeps it in a secret manager. This is a demo value in a public file.
      FLEXITYPE_BOOTSTRAP_ADMIN: "true"
      FLEXITYPE_BOOTSTRAP_ADMIN_TOKEN: "ft_01KZH2AG00DCWCTQBSWGC3G78F_marketplace-demo-admin-secret-not-for-real-use"
      # The outbox turns each merchant's webhook subscription into a managed
      # one (retries, backoff, dead-lettering). The search index powers FQL
      # matches(), which the merchant console uses.
      FLEXITYPE_OUTBOX: "true"
      FLEXITYPE_FEATURE_SEARCH_INDEX: "true"
      # The storefront runs on a private container-network address.
      FLEXITYPE_WEBHOOK_ALLOW_PRIVATE: "true"
      # Product images are stored on disk in this demo. Without it, a media
      # upload has nowhere to put the bytes.
      FLEXITYPE_BLOB_DIR: /var/lib/flexitype/blobs
    volumes:
      - blobs:/var/lib/flexitype/blobs
    ports:
      - "8080:8080"

  storefront:
    build:
      context: ../..
      dockerfile: examples/marketplace/storefront/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STOREFRONT_ADDR: ":9200"
      STOREFRONT_DB_DSN: postgres://flexitype:flexitype@postgres:5432/flexitype?sslmode=disable
      FLEXITYPE_URL: http://flexitype:8080
      # Gates merchant registration and the backfill. The platform presents it.
      MARKETPLACE_INTERNAL_TOKEN: marketplace-internal-demo-token
      # A burst of value events for one product collapses into one projection.
      STOREFRONT_DEBOUNCE: 250ms
    ports:
      - "9200:9200"

  platform:
    build:
      context: ../..
      dockerfile: examples/marketplace/platform/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      flexitype:
        condition: service_started
      storefront:
        condition: service_started
    environment:
      PLATFORM_ADDR: ":9300"
      PLATFORM_DB_DSN: postgres://flexitype:flexitype@postgres:5432/flexitype?sslmode=disable
      FLEXITYPE_URL: http://flexitype:8080
      STOREFRONT_URL: http://storefront:9200
      STOREFRONT_HOOK_BASE: http://storefront:9200/hook
      MARKETPLACE_INTERNAL_TOKEN: marketplace-internal-demo-token
      PLATFORM_API_TOKEN: platform-console-demo-token
      # The same value the flexitype service was given above. A real
      # deployment reads both from one secret, and can still use
      # FLEXITYPE_ADMIN_TOKEN_FILE to pick up a rotation without a restart.
      FLEXITYPE_ADMIN_TOKEN: "ft_01KZH2AG00DCWCTQBSWGC3G78F_marketplace-demo-admin-secret-not-for-real-use"
    ports:
      - "9300:9300"

  # The merchant console: React on the TypeScript SDK, served by nginx.
  #
  # nginx adds the console credential to every proxied request, so the browser
  # holds no token — not a merchant's, and not the console's own.
  console:
    build:
      context: ../..
      dockerfile: examples/marketplace/console/Dockerfile
    depends_on:
      platform:
        condition: service_started
    environment:
      PLATFORM_URL: http://platform:9300
      PLATFORM_API_TOKEN: platform-console-demo-token
    ports:
      - "8081:8081"

  # The shopper storefront: React over the storefront's own catalog. It needs
  # no credential at all, because the shopper API is public.
  shop:
    build:
      context: ../..
      dockerfile: examples/marketplace/shop/Dockerfile
    depends_on:
      storefront:
        condition: service_started
    environment:
      STOREFRONT_URL: http://storefront:9200
    ports:
      - "8082:8082"

volumes:
  blobs:
